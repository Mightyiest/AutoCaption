<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCaption • Pinterest-Style Projects Gallery Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&family=Outfit:wght@600;700;800&family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       Pinterest + Keeby Design System Variables
       ========================================================================== */
    :root {
      --bg-page: #F7F7F8;
      --bg-card: #FFFFFF;
      --bg-pill: #EAEBED;
      --bg-pill-hover: #DFE0E4;
      --bg-pill-active: #19191C;
      --text-pill-active: #FFFFFF;
      --text-primary: #19191C;
      --text-secondary: #65656D;
      --text-tertiary: #8E8E96;
      --accent-keeby: #FF8C17;
      --accent-keeby-hover: #E67605;
      --accent-keeby-subtle: rgba(255, 140, 23, 0.12);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-card: rgba(0, 0, 0, 0.06);
      --shadow-pin: 0 2px 10px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-pin-hover: 0 14px 30px rgba(0, 0, 0, 0.12), 0 3px 8px rgba(0, 0, 0, 0.06);
      --shadow-modal: 0 24px 60px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.08);
      --radius-pin: 20px;
      --radius-pill: 999px;
      --transition-smooth: 240ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================================================
       Pinterest Sticky Header & Search Bar
       ========================================================================== */
    header.pinterest-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247, 247, 248, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: var(--accent-keeby);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(255, 140, 23, 0.35);
      transition: transform 160ms ease;
    }

    .brand-group:hover .brand-icon {
      transform: rotate(-5deg) scale(1.04);
    }

    .brand-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      background: var(--accent-keeby-subtle);
      color: var(--accent-keeby);
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Search Bar */
    .search-box {
      flex: 1;
      max-width: 760px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      height: 44px;
      background: #EAEBED;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      padding: 0 16px 0 44px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      transition: all var(--transition-smooth);
    }

    .search-box input:focus {
      background: #FFFFFF;
      border-color: var(--accent-keeby);
      box-shadow: 0 0 0 4px rgba(255, 140, 23, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      pointer-events: none;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
    }

    /* Header Actions */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-create-pin {
      height: 44px;
      padding: 0 20px;
      border-radius: var(--radius-pill);
      background: var(--accent-keeby);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(255, 140, 23, 0.25);
      transition: all var(--transition-smooth);
      user-select: none;
    }

    .btn-create-pin:hover {
      background: var(--accent-keeby-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255, 140, 23, 0.35);
    }

    .btn-icon-round {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #EAEBED;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background var(--transition-smooth);
    }

    .btn-icon-round:hover {
      background: #DFE0E4;
      color: var(--text-primary);
    }

    /* ==========================================================================
       Pinterest Filter Chips Bar
       ========================================================================== */
    .filter-bar {
      padding: 12px 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      background: var(--bg-pill);
      color: var(--text-primary);
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-smooth);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .chip:hover:not(.active) {
      background: var(--bg-pill-hover);
    }

    .chip.active {
      background: var(--bg-pill-active);
      color: var(--text-pill-active);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .chip .chip-count {
      font-size: 11px;
      opacity: 0.7;
      font-weight: 500;
    }

    /* ==========================================================================
       Pinterest Masonry Grid Container
       ========================================================================== */
    .masonry-container {
      padding: 16px 32px 60px 32px;
      column-count: 5;
      column-gap: 22px;
    }

    @media (max-width: 1600px) {
      .masonry-container { column-count: 4; }
    }
    @media (max-width: 1200px) {
      .masonry-container { column-count: 3; }
    }
    @media (max-width: 820px) {
      .masonry-container { column-count: 2; padding: 12px 16px; column-gap: 14px; }
    }
    @media (max-width: 520px) {
      .masonry-container { column-count: 1; }
    }

    /* ==========================================================================
       Pinterest Pin Card
       ========================================================================== */
    .pin-card {
      break-inside: avoid;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }

    .pin-media-wrapper {
      position: relative;
      border-radius: var(--radius-pin);
      overflow: hidden;
      background: #EAEBED;
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-pin);
      transition: box-shadow var(--transition-smooth), transform var(--transition-smooth);
    }

    .pin-card:hover .pin-media-wrapper {
      box-shadow: var(--shadow-pin-hover);
      transform: translateY(-3px);
    }

    /* Aspect Ratio Visuals */
    .pin-media-wrapper.ratio-9-16 {
      aspect-ratio: 9 / 16;
    }
    .pin-media-wrapper.ratio-16-9 {
      aspect-ratio: 16 / 9;
    }
    .pin-media-wrapper.ratio-1-1 {
      aspect-ratio: 1 / 1;
    }
    .pin-media-wrapper.ratio-4-5 {
      aspect-ratio: 4 / 5;
    }

    .pin-visual {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 380ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pin-card:hover .pin-visual {
      transform: scale(1.035);
    }

    /* Pinterest Dark Gradient Hover Scrim */
    .pin-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.1) 40%, rgba(0, 0, 0, 0.65) 100%);
      opacity: 0;
      transition: opacity var(--transition-smooth);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      pointer-events: none;
      z-index: 10;
    }

    .pin-card:hover .pin-scrim {
      opacity: 1;
      pointer-events: auto;
    }

    /* Top Scrim Row: Aspect Ratio Tag + Open Project Button */
    .scrim-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pin-format-pill {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.02em;
    }

    .btn-pin-open {
      background: var(--accent-keeby);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      transition: transform 140ms ease, background 140ms ease;
    }

    .btn-pin-open:hover {
      background: var(--accent-keeby-hover);
      transform: scale(1.06);
    }

    /* Center Scrim: Simulated Live Viral Caption */
    .pin-caption-preview {
      text-align: center;
      padding: 0 10px;
      pointer-events: none;
      transition: transform 200ms ease;
    }

    .pin-card:hover .pin-caption-preview {
      transform: scale(1.05);
    }

    /* Caption Preset Styles */
    .cap-mrbeast {
      font-family: 'Bangers', sans-serif;
      font-size: 26px;
      letter-spacing: 1px;
      color: #FFF000;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.8);
      line-height: 1.1;
    }

    .cap-hormozi {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: #00FF66;
      background: rgba(0, 0, 0, 0.85);
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
      letter-spacing: -0.02em;
    }

    .cap-neon {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #00F5FF;
      text-shadow: 0 0 10px rgba(0, 245, 255, 0.8), 0 0 20px rgba(0, 245, 255, 0.4), 0 2px 4px #000;
    }

    .cap-karaoke {
      font-family: 'Russo One', sans-serif;
      font-size: 20px;
      color: #FFFFFF;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }
    .cap-karaoke span.highlight {
      color: #FF8C17;
      text-decoration: underline;
    }

    /* Bottom Scrim Row: Duration & Quick Actions */
    .scrim-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pin-duration {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: monospace;
    }

    .pin-quick-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-pin-action {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #19191C;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 140ms ease, background 140ms ease;
    }

    .btn-pin-action:hover {
      background: #FFFFFF;
      transform: scale(1.1);
    }

    /* Carousel / Multi-Slide Badge (like 1/10 in Pinterest screenshot) */
    .pin-carousel-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      z-index: 5;
    }

    /* Active Badge */
    .pin-active-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--accent-keeby);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      box-shadow: 0 2px 6px rgba(255, 140, 23, 0.4);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.03em;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Metadata Under Card (Pinterest Style) */
    .pin-meta {
      padding: 10px 4px 0 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pin-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .pin-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .pin-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .pin-preset-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-secondary);
    }

    /* ==========================================================================
       Pinterest-Style "Add Pin" Hero Card in Masonry
       ========================================================================== */
    .pin-add-card {
      break-inside: avoid;
      margin-bottom: 24px;
      aspect-ratio: 9 / 12;
      border-radius: var(--radius-pin);
      border: 2px dashed rgba(255, 140, 23, 0.35);
      background: rgba(255, 140, 23, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }

    .pin-add-card:hover {
      border-color: var(--accent-keeby);
      background: rgba(255, 140, 23, 0.08);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(255, 140, 23, 0.12);
    }

    .add-icon-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--accent-keeby);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(255, 140, 23, 0.3);
      transition: transform 160ms ease;
    }

    .pin-add-card:hover .add-icon-circle {
      transform: scale(1.1) rotate(90deg);
    }

    .add-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .add-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* ==========================================================================
       Project Detail & Preview Modal (Pinterest Pin Inspector)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fadeIn 180ms ease forwards;
    }

    .modal-backdrop.open {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .pinterest-modal {
      width: 100%;
      max-width: 960px;
      max-height: 88vh;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: var(--shadow-modal);
      display: flex;
      overflow: hidden;
      animation: modalSlide 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalSlide {
      from { transform: scale(0.94) translateY(20px); }
      to { transform: scale(1) translateY(0); }
    }

    @media (max-width: 768px) {
      .pinterest-modal {
        flex-direction: column;
        max-height: 94vh;
        overflow-y: auto;
      }
    }

    /* Modal Left: Video Stage / Visual Preview */
    .modal-stage {
      flex: 1.15;
      background: #0D0D10;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 440px;
      padding: 20px;
    }

    .stage-video-box {
      max-width: 100%;
      max-height: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .stage-video-box img {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
    }

    .stage-caption-overlay {
      position: absolute;
      bottom: 22%;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      animation: captionBounce 1.2s infinite ease-in-out;
    }

    @keyframes captionBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Modal Right: Details & Project Controls */
    .modal-details {
      flex: 1;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      overflow-y: auto;
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .btn-close-modal {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #EAEBED;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      transition: background 120ms ease;
    }

    .btn-close-modal:hover {
      background: #DFE0E4;
    }

    .modal-title-input {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      border: 1px solid transparent;
      padding: 4px 6px;
      border-radius: 8px;
      outline: none;
      width: 100%;
      margin-bottom: 12px;
      transition: border-color var(--transition-smooth);
    }

    .modal-title-input:hover,
    .modal-title-input:focus {
      border-color: var(--accent-keeby);
      background: #F8F8FA;
    }

    .detail-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .detail-badge {
      background: #F0F0F3;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Subtitle Segments List Preview */
    .transcript-preview-box {
      flex: 1;
      border: 1px solid var(--border-subtle);
      background: #FBFBFD;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 24px;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .transcript-preview-box::-webkit-scrollbar {
      width: 4px;
    }
    .transcript-preview-box::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 4px;
    }

    .line-item {
      font-size: 12px;
      color: var(--text-primary);
      padding: 6px 8px;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .line-time {
      font-family: monospace;
      font-size: 10.5px;
      color: var(--text-tertiary);
    }

    /* Modal CTA Action Buttons */
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .btn-open-studio {
      flex: 1;
      height: 46px;
      border-radius: var(--radius-pill);
      background: var(--accent-keeby);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 140, 23, 0.35);
      transition: all var(--transition-smooth);
    }

    .btn-open-studio:hover {
      background: var(--accent-keeby-hover);
      transform: translateY(-1px);
    }

    .btn-secondary-action {
      height: 46px;
      padding: 0 16px;
      border-radius: var(--radius-pill);
      background: #F0F0F3;
      border: 1px solid var(--border-subtle);

        // Aspect filter
        if (currentFilter === '9:16' && p.aspectRatio !== '9:16') return false;
        if (currentFilter === '16:9' && p.aspectRatio !== '16:9') return false;
        if (currentFilter === '1:1' && p.aspectRatio !== '1:1') return false;
        if (currentFilter === 'viral' && (p.presetId !== 'mrbeast' && p.presetId !== 'hormozi')) return false;
        if (currentFilter === 'recent' && !p.updatedAgo.includes('hour') && !p.updatedAgo.includes('now')) return false;

        // Search filter
        if (currentSearch.trim()) {
          const q = currentSearch.toLowerCase();
          const matchTitle = p.title.toLowerCase().includes(q);
          const matchCap = p.captionText.toLowerCase().includes(q);
          const matchPreset = p.presetName.toLowerCase().includes(q);
          if (!matchTitle && !matchCap && !matchPreset) return false;
        }
        return true;
      });

      // Update Counts
      document.getElementById('countAll').innerText = projects.length;
      document.getElementById('countShorts').innerText = projects.filter(p => p.aspectRatio === '9:16').length;
      document.getElementById('countWidescreen').innerText = projects.filter(p => p.aspectRatio === '16:9').length;
      document.getElementById('countSquare').innerText = projects.filter(p => p.aspectRatio === '1:1').length;

        const pin = document.createElement('div');
        pin.className = 'pin-card';

          // If click was on a button, don't open modal

          openProjectModal(proj.id);

            ${proj.carouselBadge ? `<div class="pin-carousel-badge">${proj.carouselBadge}</div>` : ''}

          <div class="pin-meta">
            <div class="pin-title-row">
              <span class="pin-title">${proj.title}</span>
            </div>
            <div class="pin-sub">
              <span>${proj.linesCount} lines</span>
              <span>•</span>
              <span class="pin-preset-badge">${proj.presetName}</span>
              <span>•</span>
              <span>${proj.updatedAgo}</span>
            </div>
          </div>
        `;

        grid.appendChild(pin);
      });
    }

    /* ==========================================================================
       Filter & Search Handlers
       ========================================================================== */
    function setFilter(filterType, element) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-bar .chip').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      renderMasonry();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderMasonry();
    });

    /* ==========================================================================
       Pin Detail Inspector Modal
       ========================================================================== */
    function openProjectModal(id) {
      selectedModalProjectId = id;
      const proj = projects.find(p => p.id === id);
      if (!proj) return;

      document.getElementById('modalVisual').src = proj.image;
      document.getElementById('modalCaptionOverlay').innerHTML = `<div class="${proj.captionClass}">${proj.captionText}</div>`;
      document.getElementById('modalTitleInput').value = proj.title;

      document.getElementById('modalRatioBadge').innerText = `📐 ${proj.aspectRatio} Aspect`;
      document.getElementById('modalDurationBadge').innerText = `⏱️ ${proj.duration} Duration`;
      document.getElementById('modalLinesBadge').innerText = `💬 ${proj.linesCount} Lines`;
      document.getElementById('modalPresetBadge').innerText = `🎨 ${proj.presetName}`;

      const linesList = document.getElementById('modalLinesList');
      linesList.innerHTML = '';
      (proj.lines || []).forEach(line => {
        const item = document.createElement('div');
        item.className = 'line-item';
        item.innerHTML = `
          <span>${line.text}</span>
          <span class="line-time">${line.time}</span>
        `;
        linesList.appendChild(item);
      });

      document.getElementById('projectModalBackdrop').classList.add('open');
    }

    function closeProjectModal() {
      document.getElementById('projectModalBackdrop').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'projectModalBackdrop') {
        closeProjectModal();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeProjectModal();
    });

    /* ==========================================================================
       Actions: Create, Rename, Duplicate, Delete
       ========================================================================== */
    function openNewProjectPrompt() {
      const name = "New Viral Reel #" + (projects.length + 1);
      const aspect = '9:16';
      const ratioClass = 'ratio-9-16';

      const newProj = {
        id: 'proj-' + Date.now(),
        title: name,
        aspectRatio: aspect,
        ratioClass: ratioClass,
        duration: '0:25',
        durationSec: 25,
        linesCount: 8,
        presetId: 'mrbeast',
        presetName: 'MrBeast Pop',
        captionText: 'NEW VIRAL DROP 🔥',
        captionClass: 'cap-mrbeast',
        image: 'https://images.unsplash.com/photo-1536240478700-b869070f9279?w=600&auto=format&fit=crop&q=80',
        carouselBadge: null,
        isActive: true,
        updatedAgo: 'Just now',
        lines: [
          { text: 'Hook your viewers in the first 3 seconds 🔥', time: '0.0s - 2.5s' },
          { text: 'High retention word-by-word animation', time: '2.5s - 5.0s' }
        ]
      };

      // Set other projects to inactive
      projects.forEach(p => p.isActive = false);
      projects.unshift(newProj);
      renderMasonry();
      showToast(`Created project "${name}"!`);
      openProjectModal(newProj.id);
    }

    function saveProjectRename(newTitle) {
      if (!selectedModalProjectId || !newTitle.trim()) return;
      const p = projects.find(item => item.id === selectedModalProjectId);
      if (p) {
        p.title = newTitle.trim();
        p.updatedAgo = 'Just now';
        renderMasonry();
        showToast("Renamed project to: " + p.title);
      }
    }

    function duplicateProject(id, e) {
      if (e) e.stopPropagation();
      const p = projects.find(item => item.id === id);
      if (!p) return;

      const clone = JSON.parse(JSON.stringify(p));
      clone.id = 'proj-' + Date.now();
      clone.title = 'Copy of ' + p.title;
      clone.isActive = false;
      clone.updatedAgo = 'Just now';

      const idx = projects.findIndex(item => item.id === id);
      projects.splice(idx + 1, 0, clone);
      renderMasonry();
      showToast("Duplicated project!");
    }

    function duplicateCurrentModalProject() {
      if (selectedModalProjectId) {
        duplicateProject(selectedModalProjectId);
        closeProjectModal();
      }
    }

    function deleteProject(id, e) {
      if (e) e.stopPropagation();
      const p = projects.find(item => item.id === id);
      if (!p) return;

      if (confirm(`Are you sure you want to delete "${p.title}"?`)) {
        projects = projects.filter(item => item.id !== id);
        renderMasonry();
        showToast("Project deleted.");
      }
    }

    function deleteCurrentModalProject() {
      if (selectedModalProjectId) {
        deleteProject(selectedModalProjectId);
        closeProjectModal();
      }
    }

    function openStudioProject() {
      const p = projects.find(item => item.id === selectedModalProjectId);
      closeProjectModal();
      showToast(`Opening "${p ? p.title : 'Project'}" into AutoCaption Studio...`);
    }

    function openStudioProjectDirect(id, e) {
      if (e) e.stopPropagation();
      const p = projects.find(item => item.id === id);
      showToast(`Opening "${p ? p.title : 'Project'}" into AutoCaption Studio...`);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    // Initial render
    renderMasonry();
  </script>
</body>
</html>
